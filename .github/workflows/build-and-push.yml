name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deforum_branch:
        description: "Deforum branch to build"
        required: false
        default: "main"
        type: string
      docker_tag:
        description: "Optional Docker tag suffix"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: container-builder
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}
          DEFORUM_BRANCH: ${{ github.event.inputs.deforum_branch || 'main' }}
          TAG_SUFFIX: ${{ github.event.inputs.docker_tag }}
        run: |
          IMAGE_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          VERSION="${TIMESTAMP}-${DEFORUM_BRANCH}"

          if [ -n "$TAG_SUFFIX" ]; then
            VERSION="${VERSION}-${TAG_SUFFIX}"
          fi

          echo "deforum_branch=${DEFORUM_BRANCH}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${REGISTRY}/${IMAGE_LOWER}:${VERSION}" >> $GITHUB_OUTPUT
          echo "latest_tag=${REGISTRY}/${IMAGE_LOWER}:latest" >> $GITHUB_OUTPUT

      - name: Resolve Deforum commit
        id: deforum
        env:
          DEFORUM_BRANCH: ${{ steps.meta.outputs.deforum_branch }}
        run: |
          DEFORUM_COMMIT=$(git ls-remote --exit-code \
            https://github.com/e-dream-ai/deforum-studio.git \
            "refs/heads/${DEFORUM_BRANCH}" | awk 'NR == 1 {print $1}')

          if [[ ! "$DEFORUM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve Deforum branch: ${DEFORUM_BRANCH}" >&2
            exit 1
          fi

          echo "commit=${DEFORUM_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-build
          build-args: |
            DEFORUM_COMMIT=${{ steps.deforum.outputs.commit }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
